---
name: Lint

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_CORE_VERSION: "2.22.0"
  ANSIBLE_LINT_VERSION: "26.11.0"
  YAMLLINT_VERSION: "1.38.0"
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: yamllint, ansible-lint, syntax-check, shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ansible-core==${ANSIBLE_CORE_VERSION}" \
            "ansible-lint==${ANSIBLE_LINT_VERSION}" \
            "yamllint==${YAMLLINT_VERSION}"

      - name: Install Ansible collections
        id: collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml
          else
            ansible-galaxy collection install community.general
          fi

      # The checks below are independent: each runs even if an earlier one
      # failed, so a single CI run reports every finding.
      - name: yamllint
        if: ${{ !cancelled() && steps.collections.outcome == 'success' }}
        run: yamllint --format github .

      - name: ansible-lint
        if: ${{ !cancelled() && steps.collections.outcome == 'success' }}
        run: ansible-lint

      - name: Playbook syntax check
        if: ${{ !cancelled() && steps.collections.outcome == 'success' }}
        run: ansible-playbook --syntax-check main.yml

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck bootstrap.sh
