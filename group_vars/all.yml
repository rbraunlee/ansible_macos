user:
  name: Rudolf Braun-Lee
  email: braun.ru@outlook.de
  github_username: braunrudolf

# Homebrew's default prefix: /opt/homebrew on Apple Silicon, /usr/local on Intel.
brew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
brew_bin: "{{ brew_prefix }}/bin/brew"
# Run `brew update` before installing formulae. Off by default so re-runs stay fast.
update_homebrew: false

setup_brew:
  formulae:
    - nvim
    - stow
    - npm
    - tree-sitter-cli
    - ripgrep
    - make
    - gcc
    - fd
    - starship

  cask:
    - nikitabobko/tap/aerospace
    - iterm2
    - betterdisplay
    - brave-browser
    - makemkv
    - utm
    - discord
    - whatsapp
    - obsidian
    - font-comic-shanns-mono-nerd-font
    - teamspeak-client
    - proton-pass
    - protonvpn
    - proton-mail
    - prusaslicer

macos_settings:
  dock:
    autohide: true
    tilesize: 35
    show_recents: false
  finder:
    show_all_extensions: true
    default_view_style: "clmv" # Column view
    show_path_bar: true

dotfiles:
  repo: "https://github.com/BraunRudolf/.dotfiles.git"
  dest: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
  subdirs:
    - common
    - macos
  config_destination: "{{ ansible_facts['env']['HOME'] }}/.config"
features:
  install_oh_my_zsh: true
  configure_git: true
