---
# Generic defaults. Put personal values (name, email, dotfiles repo, ...) in the
# untracked vars/local.yml; see vars/local.example.yml.
user:
  name: ""
  email: ""
  github_username: ""

# Homebrew's default prefix: /opt/homebrew on Apple Silicon, /usr/local on Intel.
brew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
brew_bin: "{{ brew_prefix }}/bin/brew"
# Run `brew update` before installing formulae. Off by default so re-runs stay fast.
update_homebrew: false

setup_brew:
  formulae:
    - nvim
    - stow
    - npm
    - tree-sitter-cli
    - ripgrep
    - make
    - gcc
    - fd
    - starship

  cask:
    - nikitabobko/tap/aerospace
    - iterm2
    - betterdisplay
    - brave-browser
    - makemkv
    - utm
    - discord
    - whatsapp
    - obsidian
    - font-comic-shanns-mono-nerd-font
    - teamspeak-client
    - proton-pass
    - protonvpn
    - proton-mail
    - prusaslicer

macos_settings:
  dock:
    autohide: true
    tilesize: 35
    show_recents: false
  finder:
    show_all_extensions: true
    default_view_style: "clmv"  # icnv=Icon, Nlsv=List, clmv=Column, glyv=Gallery
    show_path_bar: true

dotfiles:
  # Git URL of your dotfiles repo. Set it in vars/local.yml; the dotfiles steps are
  # skipped while it is empty.
  repo: ""
  dest: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
  # Branch, tag or commit checked out by the first clone. Ignored once the clone exists.
  version: main
  subdirs:
    - common
    - macos
  config_destination: "{{ ansible_facts['env']['HOME'] }}/.config"
features:
  install_zap: true
  configure_git: true
